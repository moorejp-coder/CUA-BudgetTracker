services:
  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    volumes:
      - budget-data:/app/data
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"
    restart: unless-stopped

  # Optional: switch DATABASE_URL in backend/.env to use this instead of SQLite.
  # postgres:
  #   image: postgres:16-alpine
  #   environment:
  #     POSTGRES_USER: budget
  #     POSTGRES_PASSWORD: budget
  #     POSTGRES_DB: budget_tracker
  #   volumes:
  #     - postgres-data:/var/lib/postgresql/data
  #   ports:
  #     - "5432:5432"

volumes:
  budget-data:
  # postgres-data:
